spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dpc}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

server:
  port: ${SERVER_PORT:8080}

userauth:
  # Base URL of the internal UserAuth service that dpc-api delegates authentication
  # to (registration, login, token validation, logout). UserAuth listens on 9998.
  url: ${USERAUTH_URL:http://localhost:9998}

dpc:
  cors:
    # Comma-separated list of origins allowed to call the API (CORS).
    # The `*` default allows all origins; set this explicitly to the site
    # origin(s) in production, e.g. https://dansplugins.com
    allowed-origins: ${DPC_CORS_ALLOWED_ORIGINS:*}
  sync:
    safety:
      # Smallest incoming batch that may deactivate factions. Smaller batches
      # are still upserted but never disband missing factions — this stops a
      # plugin briefly seeing an empty/short faction list from wiping the
      # registry for that server.
      minimum-incoming-factions: ${DPC_SYNC_MIN_INCOMING:2}
      # Hard ratio cap (0..1) on factions that one sync may deactivate.
      max-deactivation-ratio: ${DPC_SYNC_MAX_DEACTIVATION_RATIO:0.5}
      # Hard absolute cap on factions that one sync may deactivate. 0 disables.
      max-deactivations-per-sync: ${DPC_SYNC_MAX_DEACTIVATIONS:1000}
  backlog:
    # GitHub org the dev-portal backlog console mirrors open issues/PRs from.
    org: ${DPC_BACKLOG_ORG:Dans-Plugins}
    # Optional classic PAT (no scopes needed — search only reads public data).
    # Raises the GitHub Search API rate limit from 10/min to 30/min.
    github-token: ${DPC_BACKLOG_GITHUB_TOKEN:}
    # How often the sync re-pulls GitHub, in milliseconds. Kept well above the
    # search API's per-minute rate limit floor.
    sync-interval-ms: ${DPC_BACKLOG_SYNC_INTERVAL_MS:900000}
    # How long after startup the first sync runs, in milliseconds. Declared here
    # rather than only in BacklogSyncService's @Scheduled annotation, so every
    # knob of the sync is visible in one place.
    sync-initial-delay-ms: ${DPC_BACKLOG_SYNC_INITIAL_DELAY_MS:5000}
    # Disable in tests/local runs that shouldn't call out to the real GitHub API.
    sync-enabled: ${DPC_BACKLOG_SYNC_ENABLED:true}
  releases:
    # Optional classic PAT for the release mirror. Falls back to the backlog
    # token: both only read public data, so either needs an authenticated
    # identity rather than any particular scope. Without one the sync runs at
    # GitHub's unauthenticated 60 requests/hour, which one pass over the
    # catalogue fits inside — but not with much room.
    github-token: ${DPC_RELEASE_SYNC_GITHUB_TOKEN:${DPC_BACKLOG_GITHUB_TOKEN:}}
    # How often the release mirror re-pulls GitHub, in milliseconds. Hourly:
    # releases change far less often than issues do, and every pass costs one
    # request per plugin.
    sync-interval-ms: ${DPC_RELEASE_SYNC_INTERVAL_MS:3600000}
    # How long after startup the first release sync runs, in milliseconds.
    # Staggered behind the backlog sync so the two don't call GitHub at once.
    sync-initial-delay-ms: ${DPC_RELEASE_SYNC_INITIAL_DELAY_MS:15000}
    # Disable in tests/local runs that shouldn't call out to the real GitHub API.
    sync-enabled: ${DPC_RELEASE_SYNC_ENABLED:true}
    # How far back the mirror reaches, per plugin. Also the point at which the
    # sync stops assuming it has seen a plugin's whole release history — see
    # ReleaseSyncService for what that changes.
    max-releases-per-plugin: ${DPC_RELEASE_SYNC_MAX_RELEASES:20}
  claims:
    # A claim with no activity for this many days is auto-released.
    auto-release-after-days: ${DPC_CLAIMS_AUTO_RELEASE_DAYS:30}
  admin:
    # Comma-separated UserAuth usernames allowed to convert a feature request
    # into a real GitHub issue. Empty by default — nobody can convert until
    # this is set.
    usernames: ${DPC_ADMIN_USERNAMES:}
  feature-requests:
    # Needs a classic PAT with at least 'public_repo' scope — creating a GitHub
    # issue is a write, unlike the read-only backlog sync above. Falls back to
    # dpc.backlog.github-token if unset, since both just need an authenticated
    # GitHub identity with access to the Dans-Plugins repos.
    github-token: ${DPC_FEATURE_REQUEST_GITHUB_TOKEN:${DPC_BACKLOG_GITHUB_TOKEN:}}
