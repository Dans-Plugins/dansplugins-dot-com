spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false

dpc:
  sync:
    safety:
      # The integration tests cover the ratio guard via syncFactions_safetyGuard_
      # blocksWipeFromTransientShortBatch; setting the floor to 1 keeps the
      # legacy 1-faction-batch disband tests exercising the disband path. The
      # dedicated unit tests in FactionServiceTest verify the floor itself.
      minimum-incoming-factions: 1
      max-deactivation-ratio: 0.5
      max-deactivations-per-sync: 1000
  backlog:
    org: Dans-Plugins
    # Tests exercise BacklogSyncService directly; the scheduled trigger must not
    # also fire and make real calls out to the GitHub API.
    sync-enabled: false
  releases:
    # Same reasoning as the backlog sync above: ReleaseSyncServiceTest drives the
    # service directly, so the schedule must not also reach out to GitHub.
    sync-enabled: false
