version: "3"
services:
  dpc-website:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:45345}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:45345}
    volumes:
      - ./node_modules:/app/node_modules
      - ./data:/app/data
    restart: always

  dpc-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dpc
      POSTGRES_USER: dpc
      POSTGRES_PASSWORD: dpc
    ports:
      - "5432:5432"
    volumes:
      - dpc-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpc -d dpc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  dpc-api:
    build: ./dpc-api
    ports:
      - "${API_PORT:-45345}:8080"
    environment:
      DB_HOST: dpc-db
      DB_PORT: 5432
      DB_NAME: dpc
      DB_USERNAME: dpc
      DB_PASSWORD: dpc
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # Faction-sync safety guards. Defaults match dpc-api/README.md; override
      # by exporting these on the host before running docker compose.
      DPC_SYNC_MIN_INCOMING: ${DPC_SYNC_MIN_INCOMING:-2}
      DPC_SYNC_MAX_DEACTIVATION_RATIO: ${DPC_SYNC_MAX_DEACTIVATION_RATIO:-0.5}
      DPC_SYNC_MAX_DEACTIVATIONS: ${DPC_SYNC_MAX_DEACTIVATIONS:-1000}
      # Discord announcement ingestion (News feed). Disabled by default; set
      # DISCORD_ENABLED=true and provide a bot token + channel id to enable.
      # See dpc-api/README.md "Discord announcement ingestion".
      DISCORD_ENABLED: ${DISCORD_ENABLED:-false}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ANNOUNCEMENTS_CHANNEL_ID: ${DISCORD_ANNOUNCEMENTS_CHANNEL_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
    depends_on:
      dpc-db:
        condition: service_healthy
    restart: always

volumes:
  dpc-db-data: